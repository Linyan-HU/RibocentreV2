<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  <script src="{{ '/js/ribocentre-theme.js' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ "/css/main.css" | relative_url }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="shortcut icon" type ="image/x-icon" href="{{ '/images/favicon.ico' | relative_url }}">

{% if jekyll.environment == 'production' %}
{% include analytics.html %}
{% endif %}

  <link rel="stylesheet" href="{{ '/css/foldbridge-tokens.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/foldbridge-style.css' | relative_url }}">
  {% if page.url == '/' %}<link rel="stylesheet" href="{{ '/css/family-statistics.css' | relative_url }}?v=762d74241a">{% endif %}
  <link rel="stylesheet" href="{{ '/css/ui-icons.css' | relative_url }}">
</head>
